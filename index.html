<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCAPE</title>
<!-- page shell: body margin, background, height. Drop it if your site
     already resets the page — scape-intro.css touches nothing outside .stage. -->
<link rel="stylesheet" href="scape-page.css">
<link rel="stylesheet" href="scape-intro.css">
</head>
<body>

<div class="stage">
  <header>
    <button class="menu-btn" type="button" aria-label="Menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <div id="logo"></div>
    <div class="search-container">
      <div class="search-wrapper">
        <input type="search" class="search-input" placeholder="Search" aria-label="Search">
        <div class="search-icon" aria-hidden="true">&#8981;</div>
      </div>
    </div>
    <div class="header-right"><div id="accountButton">CONNECT</div></div>
  </header>
  <main>
    <div class="logoBox">
      <div class="logo">
        <div class="el1"></div><div class="el2"></div><div class="el3"></div>
        <div class="el4"></div><div class="el5"></div><div class="el6"></div>
      </div>
    </div>
    <div class="intro">
      <div class="button"><canvas class="btn-canvas"></canvas>
        <div class="label" data-text="CREATE"><span class="lbl-glyphs"></span></div></div>
      <div class="button"><canvas class="btn-canvas"></canvas>
        <div class="label" data-text="EXPLORE"><span class="lbl-glyphs"></span></div></div>
    </div>
  </main>
</div>

<script src="scape-config.js"></script>
<script src="scape-intro.js"></script>
<script>SCAPE.mount('.stage', window.SCAPE_CONFIG);</script>

<!-- Tuning only. Press T to open the panel; drop this line to ship. -->
<script src="scape-tune.js"></script>
</body></html>
